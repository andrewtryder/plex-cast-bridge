[project]
name = "plex-cast-bridge"
version = "0.5.0"
description = "Personal Google Home Cloud-to-Cloud Integration, Gemini-Powered Smart DJ, and Continuous Plex Radio for Google Cast"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2",
    "pydantic-settings>=2",
    "plexapi>=4.16",
    "pychromecast>=14",
    "google-genai>=1",
    "google-cloud-pubsub>=2",
    "pyjwt[crypto]>=2.9",
    "python-multipart>=0.0.18",
    "jinja2>=3.1.4",
    "google-cloud-firestore>=2.19.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "httpx>=0.28",
    "pillow>=11",
    "radon>=6",
    "ruff>=0.8",
    "pre-commit>=4",
]
# Canonical Cloud Run gateway set. Regenerate gcp-cloud-run/requirements.txt with:
#   uv export --only-group cloud-gateway --no-emit-project --no-dev --no-hashes -o gcp-cloud-run/requirements.txt
cloud-gateway = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2",
    "pydantic-settings>=2",
    "google-cloud-pubsub>=2",
    "pyjwt[crypto]>=2.9",
    "python-multipart>=0.0.18",
    "jinja2>=3.1.4",
    "google-cloud-firestore>=2.19.0",
    "google-cloud-storage>=2.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plex_cast_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "gcp-cloud-run/src"]
markers = [
    "unit: isolated Python test run without Docker or an external image",
    "docker_integration: requires a local Docker daemon or image",
    "upgrade_e2e: Docker upgrade, compatibility, or rollback scenario",
    "workflow: validates repository automation or release workflow contracts",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C90"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
# Phase 1 records the existing high-complexity baseline without blocking
# unrelated safety fixes. Lower this ratchet only alongside targeted refactors.
max-complexity = 50

[tool.coverage.run]
branch = true
parallel = true
# Dynamic pytest contexts require the C tracer; Python 3.14 otherwise selects
# sys.monitoring, which intentionally does not record them.
core = "ctrace"

[tool.coverage.report]
skip_empty = true
