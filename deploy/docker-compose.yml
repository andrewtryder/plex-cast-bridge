services:
  plex-cast-bridge:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ghcr.io/andrewtryder/plex-cast-bridge:latest
    container_name: plex-cast-bridge
    restart: unless-stopped
    # host networking is required for Chromecast mDNS discovery on the local subnet
    network_mode: host
    env_file:
      - ../.env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-credentials.json
      - PORT=8000
      - DATA_DIR=/data
    volumes:
      # Mount Google Cloud Service Account key for Pub/Sub authentication
      - ../gcp-credentials.json:/app/gcp-credentials.json:ro
      # Persistent mutable data directory (catalog.json, dead_letter_queue.jsonl)
      - ../data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
