services:
  plex-cast-bridge:
    image: ghcr.io/andrewtryder/plex-cast-bridge:latest
    container_name: plex-cast-bridge
    restart: unless-stopped
    # host networking is required for Chromecast mDNS discovery on the local subnet
    network_mode: host
    env_file:
      - ${PCB_ENV_FILE:-../.env}
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-credentials.json
      - PORT=8000
      - DATA_DIR=/data
    volumes:
      # Mount Google Cloud Service Account key for Pub/Sub authentication
      - ${PCB_GCP_CREDENTIALS:-../gcp-credentials.json}:/app/gcp-credentials.json:ro
      # Persistent mutable data directory (catalog.json, dead_letter_queue.jsonl, plex_connection.json, music_index.sqlite3)
      # Defaults to ../data for existing Docker Compose repository checkouts.
      # For Portainer Git-stacks, use deploy/docker-compose.portainer.yml or set PCB_DATA_DIR to an absolute host path.
      - ${PCB_DATA_DIR:-../data}:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
