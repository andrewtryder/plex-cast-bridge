# Source-build override for developers, custom builds, and forks.
#
# Usage:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.build.yml up -d --build
#
# When this override file is included, Compose builds the local image from source
# instead of pulling the official release from GHCR.
services:
  plex-cast-bridge:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
