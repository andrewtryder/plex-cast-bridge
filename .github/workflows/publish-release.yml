name: Publish Verified Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without a v prefix (for example 0.3.0)
        required: true
        type: string
      ref:
        description: Reviewed commit or branch to release
        required: true
        default: main
        type: string

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate requested version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Version must be numeric semver without a v prefix" >&2
            exit 2
          }

      - name: Checkout reviewed release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Fetch origin main
        run: git fetch origin main --tags

      - name: Validate release commit is on main
        id: revision
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python scripts/verify_release_commit.py \
            --version "$RELEASE_VERSION" \
            --ref "${{ inputs.ref }}" \
            --main-ref origin/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Refuse an existing release tag
        env:
          RELEASE_TAG: v${{ inputs.version }}
        run: |
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" && {
            echo "Release tag already exists: $RELEASE_TAG" >&2
            exit 1
          } || status=$?
          [[ "$status" == 2 ]] || exit "$status"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse an existing versioned image
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if docker buildx imagetools inspect \
              "ghcr.io/${GITHUB_REPOSITORY}:${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Versioned image already exists: ${RELEASE_VERSION}" >&2
            exit 1
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}

      - name: Build and push multi-architecture release image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify immutable artifact and OCI metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python scripts/verify_release_artifact.py \
            --image "ghcr.io/${GITHUB_REPOSITORY}:${RELEASE_VERSION}" \
            --expected-digest "$IMAGE_DIGEST" \
            --expected-version "$RELEASE_VERSION" \
            --expected-revision "${{ steps.revision.outputs.sha }}"

      - name: Create the tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ inputs.version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"

      - name: Promote the verified digest to latest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${GITHUB_REPOSITORY}:latest" \
            "ghcr.io/${GITHUB_REPOSITORY}@${IMAGE_DIGEST}"
