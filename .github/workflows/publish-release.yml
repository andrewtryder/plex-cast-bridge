name: Publish Verified Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Release mode: 'candidate' (build & verify candidate image, halt before promotion) or 'promote' (verify candidate digest and promote to version tags and latest)"
        required: true
        type: choice
        options:
          - candidate
          - promote
        default: candidate
      version:
        description: Release version without a v prefix (for example 0.5.0)
        required: true
        type: string
      ref:
        description: Reviewed commit or branch to release
        required: true
        default: main
        type: string
      candidate_digest:
        description: "Candidate multi-arch image digest (required for mode=promote, e.g. sha256:...)"
        required: false
        type: string
      allow_recovery:
        description: Safely resume publication if a previous run partially failed (re-verifies existing artifacts)
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate requested version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Version must be numeric semver without a v prefix" >&2
            exit 2
          }

      - name: Validate promotion parameters
        if: ${{ inputs.mode == 'promote' }}
        env:
          CANDIDATE_DIGEST: ${{ inputs.candidate_digest }}
        run: |
          if [ -z "$CANDIDATE_DIGEST" ]; then
            echo "::error::candidate_digest input is required when mode=promote" >&2
            exit 2
          fi
          if [[ ! "$CANDIDATE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::candidate_digest '$CANDIDATE_DIGEST' must be a valid sha256 digest format (sha256:...)" >&2
            exit 2
          fi

      - name: Checkout reviewed release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Fetch origin main
        run: git fetch origin main --tags

      - name: Validate release commit is on main
        id: revision
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/verify_release_commit.py \
            --version "$RELEASE_VERSION" \
            --ref "${{ inputs.ref }}" \
            --main-ref origin/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check release tag status
        if: ${{ inputs.mode == 'promote' }}
        id: tag_status
        env:
          RELEASE_TAG: v${{ inputs.version }}
          EXPECTED_SHA: ${{ steps.revision.outputs.sha }}
          ALLOW_RECOVERY: ${{ inputs.allow_recovery }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag $RELEASE_TAG already exists on remote"
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            python3 scripts/verify_release_commit.py \
              --version "${{ inputs.version }}" \
              --ref "${{ inputs.ref }}" \
              --verify-tag "$RELEASE_TAG"
            if [ "$ALLOW_RECOVERY" != "true" ]; then
              echo "Release tag already exists: $RELEASE_TAG; set allow_recovery to true to resume" >&2
              exit 1
            fi
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release tag does not exist yet (clean release or tag required)"
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: ${{ inputs.mode == 'candidate' }}
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check versioned image status
        if: ${{ inputs.mode == 'promote' }}
        id: image_status
        env:
          RELEASE_IMAGE: ghcr.io/${{ github.repository }}:${{ inputs.version }}
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ steps.revision.outputs.sha }}
          ALLOW_RECOVERY: ${{ inputs.allow_recovery }}
        run: |
          if docker buildx imagetools inspect "$RELEASE_IMAGE" >/dev/null 2>&1; then
            echo "Versioned image $RELEASE_IMAGE already exists on GHCR"
            if [ "$ALLOW_RECOVERY" != "true" ]; then
              echo "Versioned image already exists: $RELEASE_IMAGE; set allow_recovery to true to resume" >&2
              exit 1
            fi
            echo "Verifying existing image artifact for recovery..."
            OUTPUT=$(python3 scripts/verify_release_artifact.py \
              --image "$RELEASE_IMAGE" \
              --expected-version "$RELEASE_VERSION" \
              --expected-revision "$EXPECTED_SHA")
            DIGEST=$(echo "$OUTPUT" | python3 -c "import sys, json; print(json.load(sys.stdin)['digest'])")
            echo "Existing image verified with digest $DIGEST"
            echo "image_exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          else
            echo "Versioned image does not exist yet (clean release or image build required)"
            echo "image_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Docker metadata for candidate
        if: ${{ inputs.mode == 'candidate' }}
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=candidate-${{ inputs.version }}
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}

      - name: Build and push candidate multi-architecture image
        if: ${{ inputs.mode == 'candidate' }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:candidate-${{ inputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify candidate artifact and OCI metadata (candidate mode)
        if: ${{ inputs.mode == 'candidate' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 scripts/verify_release_artifact.py \
            --image "ghcr.io/${GITHUB_REPOSITORY}:candidate-${RELEASE_VERSION}" \
            --expected-digest "$IMAGE_DIGEST" \
            --expected-version "$RELEASE_VERSION" \
            --expected-revision "${{ steps.revision.outputs.sha }}"

      - name: Record candidate summary and halt
        if: ${{ inputs.mode == 'candidate' }}
        run: |
          VERSION="${{ inputs.version }}"
          DIGEST="${{ steps.build.outputs.digest }}"
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Candidate Image Built & Verified

          - **Version:** \`${VERSION}\`
          - **Commit:** \`${{ steps.revision.outputs.sha }}\`
          - **Candidate Tag:** \`ghcr.io/${GITHUB_REPOSITORY}:candidate-${VERSION}\`
          - **Immutable Digest:** \`${DIGEST}\`
          - **Platforms:** \`linux/amd64\`, \`linux/arm64\`

          ### Acceptance & Promotion Instructions:
          1. Use this exact candidate image for live deployment acceptance testing on Proxmox LXC 112:
             \`\`\`bash
             docker pull ghcr.io/${GITHUB_REPOSITORY}:candidate-${VERSION}@${DIGEST}
             \`\`\`
          2. Complete acceptance verification on Proxmox LXC 112 and Cloud Run.
          3. When acceptance is verified and signed off, trigger this workflow with:
             - **mode:** \`promote\`
             - **version:** \`${VERSION}\`
             - **candidate_digest:** \`${DIGEST}\`
          EOF
          echo "Candidate mode complete. Halting before promotion."

      - name: Verify candidate artifact and OCI metadata (promote mode)
        if: ${{ inputs.mode == 'promote' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          IMAGE_DIGEST: ${{ inputs.candidate_digest }}
        run: |
          python3 scripts/verify_release_artifact.py \
            --image "ghcr.io/${GITHUB_REPOSITORY}:candidate-${RELEASE_VERSION}" \
            --expected-digest "$IMAGE_DIGEST" \
            --expected-version "$RELEASE_VERSION" \
            --expected-revision "${{ steps.revision.outputs.sha }}"

      - name: Publish verified versioned tags to GHCR
        if: ${{ inputs.mode == 'promote' && steps.image_status.outputs.image_exists != 'true' }}
        env:
          IMAGE_DIGEST: ${{ inputs.candidate_digest }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          MAJOR_MINOR="$(echo "$RELEASE_VERSION" | cut -d. -f1,2)"
          for attempt in 1 2 3; do
            if docker buildx imagetools create \
              --tag "ghcr.io/${GITHUB_REPOSITORY}:${RELEASE_VERSION}" \
              --tag "ghcr.io/${GITHUB_REPOSITORY}:${MAJOR_MINOR}" \
              "ghcr.io/${GITHUB_REPOSITORY}@${IMAGE_DIGEST}"; then
              break
            fi
            echo "Attempt $attempt failed; retrying in 5s..." >&2
            sleep 5
          done

      - name: Create release tag
        if: ${{ inputs.mode == 'promote' && steps.tag_status.outputs.tag_exists != 'true' }}
        env:
          RELEASE_TAG: v${{ inputs.version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          for attempt in 1 2 3; do
            if git push origin "$RELEASE_TAG"; then
              break
            fi
            echo "Git push attempt $attempt failed; retrying in 5s..." >&2
            sleep 5
          done

      - name: Create GitHub release
        if: ${{ inputs.mode == 'promote' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ inputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists"
          else
            echo "Creating GitHub release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi

      - name: Promote the verified digest to latest
        if: ${{ inputs.mode == 'promote' }}
        env:
          IMAGE_DIGEST: ${{ inputs.candidate_digest || steps.image_status.outputs.digest }}
        run: |
          for attempt in 1 2 3; do
            if docker buildx imagetools create \
              --tag "ghcr.io/${GITHUB_REPOSITORY}:latest" \
              "ghcr.io/${GITHUB_REPOSITORY}@${IMAGE_DIGEST}"; then
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 5s..." >&2
            sleep 5
          done
          echo "Failed to promote digest to latest after 3 attempts" >&2
          exit 1

      - name: Record promotion summary
        if: ${{ inputs.mode == 'promote' }}
        run: |
          VERSION="${{ inputs.version }}"
          DIGEST="${{ inputs.candidate_digest || steps.image_status.outputs.digest }}"
          MAJOR_MINOR="$(echo "$VERSION" | cut -d. -f1,2)"
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Release Successfully Promoted!

          - **Version:** \`${VERSION}\`
          - **Git Tag:** \`v${VERSION}\`
          - **Verified Source Digest:** \`${DIGEST}\`
          - **Promoted GHCR Tags:**
            - \`ghcr.io/${GITHUB_REPOSITORY}:${VERSION}\`
            - \`ghcr.io/${GITHUB_REPOSITORY}:${MAJOR_MINOR}\`
            - \`ghcr.io/${GITHUB_REPOSITORY}:latest\`

          All public tags now point cryptographically to the exact candidate image verified during acceptance testing.
          EOF
