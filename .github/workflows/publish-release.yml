name: Publish Verified Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Release mode: 'candidate' (build & verify candidate image, halt before promotion) or 'promote' (verify candidate digest and promote to version tags and latest)"
        required: true
        type: choice
        options:
          - candidate
          - promote
        default: candidate
      version:
        description: Release version without a v prefix (for example 0.5.0)
        required: true
        type: string
      ref:
        description: Reviewed commit or branch to release
        required: true
        default: main
        type: string
      candidate_digest:
        description: "Candidate multi-arch image digest (required for mode=promote, e.g. sha256:...)"
        required: false
        type: string
      allow_recovery:
        description: Safely resume publication if a previous run partially failed (re-verifies existing artifacts)
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate requested version
        env:
          MODE: ${{ inputs.mode }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$MODE" != "candidate" ] && [ "$MODE" != "promote" ]; then
            echo "Mode must be 'candidate' or 'promote'" >&2
            exit 2
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Version must be numeric semver without a v prefix" >&2
            exit 2
          }

      - name: Validate promotion parameters
        if: ${{ inputs.mode == 'promote' }}
        env:
          CANDIDATE_DIGEST: ${{ inputs.candidate_digest }}
        run: |
          if [ -z "$CANDIDATE_DIGEST" ]; then
            echo "::error::candidate_digest input is required when mode=promote" >&2
            exit 2
          fi
          if [[ ! "$CANDIDATE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::candidate_digest '$CANDIDATE_DIGEST' must be a valid sha256 digest format (sha256:...)" >&2
            exit 2
          fi

      - name: Checkout reviewed release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Fetch origin main
        run: git fetch origin main --tags

      - name: Validate release commit is on main
        id: revision
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          python3 scripts/verify_release_commit.py \
            --version "$RELEASE_VERSION" \
            --ref "$RELEASE_REF" \
            --main-ref origin/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check release tag status
        if: ${{ inputs.mode == 'promote' }}
        id: tag_status
        env:
          RELEASE_TAG: v${{ inputs.version }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ inputs.ref }}
          ALLOW_RECOVERY: ${{ inputs.allow_recovery }}
        run: |
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "Release tag $RELEASE_TAG already exists on remote"
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            python3 scripts/verify_release_commit.py \
              --version "$RELEASE_VERSION" \
              --ref "$RELEASE_REF" \
              --verify-tag "$RELEASE_TAG"
            if [ "$ALLOW_RECOVERY" != "true" ]; then
              echo "Release tag already exists: $RELEASE_TAG; set allow_recovery to true to resume" >&2
              exit 1
            fi
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 2 ]; then
            echo "Release tag does not exist yet (clean release or tag required)"
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unable to query remote release tag $RELEASE_TAG (git ls-remote exited $rc)" >&2
            exit "$rc"
          fi

      - name: Set up QEMU
        if: ${{ inputs.mode == 'candidate' }}
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check versioned image status
        if: ${{ inputs.mode == 'promote' }}
        id: image_status
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          CANDIDATE_DIGEST: ${{ inputs.candidate_digest }}
          EXPECTED_SHA: ${{ steps.revision.outputs.sha }}
          ALLOW_RECOVERY: ${{ inputs.allow_recovery }}
        run: |
          RELEASE_IMAGE="ghcr.io/${GITHUB_REPOSITORY}:${RELEASE_VERSION}"
          MAJOR_MINOR="${RELEASE_VERSION%.*}"
          MAJOR_MINOR_IMAGE="ghcr.io/${GITHUB_REPOSITORY}:${MAJOR_MINOR}"
          if docker buildx imagetools inspect "$RELEASE_IMAGE" >/dev/null 2>&1; then
            echo "Versioned image $RELEASE_IMAGE already exists on GHCR"
            if [ "$ALLOW_RECOVERY" != "true" ]; then
              echo "Versioned image already exists: $RELEASE_IMAGE; set allow_recovery to true to resume" >&2
              exit 1
            fi
            echo "Verifying existing image artifact for recovery against approved candidate digest..."
            OUTPUT=$(python3 scripts/verify_release_artifact.py \
              --image "$RELEASE_IMAGE" \
              --expected-digest "$CANDIDATE_DIGEST" \
              --expected-version "$RELEASE_VERSION" \
              --expected-revision "$EXPECTED_SHA")
            DIGEST=$(echo "$OUTPUT" | python3 -c "import sys, json; print(json.load(sys.stdin)['digest'])")
            echo "Existing image verified with digest $DIGEST"
            if python3 scripts/verify_release_artifact.py \
              --image "$MAJOR_MINOR_IMAGE" \
              --expected-digest "$CANDIDATE_DIGEST" \
              --expected-version "$RELEASE_VERSION" \
              --expected-revision "$EXPECTED_SHA" >/dev/null 2>&1; then
              echo "image_exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "Major/minor tag $MAJOR_MINOR_IMAGE missing or mismatched; will re-tag from approved candidate digest"
              echo "image_exists=false" >> "$GITHUB_OUTPUT"
            fi
            echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          else
            echo "Versioned image does not exist yet (clean release or image build required)"
            echo "image_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Docker metadata for candidate
        if: ${{ inputs.mode == 'candidate' }}
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=candidate-${{ inputs.version }}
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}

      - name: Build and push candidate multi-architecture image
        if: ${{ inputs.mode == 'candidate' }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:candidate-${{ inputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify candidate artifact and OCI metadata (candidate mode)
        if: ${{ inputs.mode == 'candidate' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          python3 scripts/verify_release_artifact.py \
            --image "ghcr.io/${GITHUB_REPOSITORY}:candidate-${RELEASE_VERSION}" \
            --expected-digest "$IMAGE_DIGEST" \
            --expected-version "$RELEASE_VERSION" \
            --expected-revision "$EXPECTED_SHA"

      - name: Set up uv for candidate acceptance tests
        if: ${{ inputs.mode == 'candidate' }}
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run Linux Docker acceptance matrix against exact candidate digest
        if: ${{ inputs.mode == 'candidate' }}
        env:
          CANDIDATE_IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          PCB_TEST_DOCKER_IMAGE: "1"
          PCB_TEST_UPGRADE_E2E: "1"
          PCB_TEST_UPGRADE_TARGET: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          PCB_TEST_FIRST_TARGET: ghcr.io/andrewtryder/plex-cast-bridge@sha256:b0db066ed210255039515602dbe3759f697203f42b2b2a39214835dbc2b83422
          PCB_TEST_SQLITE_ONLINE: "1"
          PCB_TEST_SQLITE_IMAGE: plex-cast-bridge-config-drift-test
          PCB_TEST_COMPOSE_RECREATE: "1"
          PCB_TEST_EXPECTED_PYTHON: "3.15"
          PCB_TEST_PREBUILT_IMAGE: "1"
          PCB_TEST_LOCAL_IMAGE: plex-cast-bridge-config-drift-test
        run: |
          set -euo pipefail
          docker pull "$CANDIDATE_IMAGE"
          docker tag "$CANDIDATE_IMAGE" "$PCB_TEST_LOCAL_IMAGE"
          docker image inspect "$PCB_TEST_LOCAL_IMAGE" >/dev/null
          uv sync --all-extras --dev
          uv run --dev pytest -q -m docker_integration --durations=20 --log-cli-level=WARNING

      - name: Verify official legacy image upgrade to candidate digest
        if: ${{ inputs.mode == 'candidate' }}
        env:
          CANDIDATE_IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          PCB_TEST_UPGRADE_E2E: "1"
          PCB_TEST_START_IMAGE: ghcr.io/andrewtryder/plex-cast-bridge@sha256:a66f551562750ba50a11f2e4aeb20753e45ad44667375e2869bcbc15a8e5afbb
          PCB_TEST_UPGRADE_TARGET: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          PCB_TEST_EXPECTED_PYTHON: "3.15"
          PCB_TEST_PREBUILT_IMAGE: "1"
          PCB_TEST_LOCAL_IMAGE: plex-cast-bridge-config-drift-test
        run: |
          uv run --dev pytest -q 'tests/test_upgrade_real_bridge.py::test_real_bridge_upgrade_preserves_plex_configuration[True]'

      - name: Record candidate summary and halt
        if: ${{ inputs.mode == 'candidate' }}
        env:
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Candidate Image Built & Verified

          - **Version:** \`${VERSION}\`
          - **Commit:** \`${EXPECTED_SHA}\`
          - **Candidate Tag:** \`ghcr.io/${GITHUB_REPOSITORY}:candidate-${VERSION}\`
          - **Immutable Digest:** \`${DIGEST}\`
          - **Platforms:** \`linux/amd64\`, \`linux/arm64\`
          - **Automated acceptance:** Exact digest Docker matrix and legacy-image upgrade passed.

          ### Acceptance & Promotion Instructions:
          1. Use this exact immutable candidate image for live deployment acceptance testing on Proxmox LXC 112:
             \`\`\`bash
             docker pull ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}
             \`\`\`
          2. Complete acceptance verification on Proxmox LXC 112 and Cloud Run.
          3. When acceptance is verified and signed off, trigger this workflow with:
             - **mode:** \`promote\`
             - **version:** \`${VERSION}\`
             - **candidate_digest:** \`${DIGEST}\`
          EOF
          echo "Candidate mode complete. Halting before promotion."

      - name: Verify candidate artifact and OCI metadata (promote mode)
        if: ${{ inputs.mode == 'promote' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          CANDIDATE_DIGEST: ${{ inputs.candidate_digest }}
          EXPECTED_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          python3 scripts/verify_release_artifact.py \
            --image "ghcr.io/${GITHUB_REPOSITORY}:candidate-${RELEASE_VERSION}" \
            --expected-digest "$CANDIDATE_DIGEST" \
            --expected-version "$RELEASE_VERSION" \
            --expected-revision "$EXPECTED_SHA"

      - name: Publish verified versioned tags to GHCR
        if: ${{ inputs.mode == 'promote' && steps.image_status.outputs.image_exists != 'true' }}
        env:
          IMAGE_DIGEST: ${{ inputs.candidate_digest }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          MAJOR_MINOR="${RELEASE_VERSION%.*}"
          for attempt in 1 2 3; do
            if docker buildx imagetools create \
              --tag "ghcr.io/${GITHUB_REPOSITORY}:${RELEASE_VERSION}" \
              --tag "ghcr.io/${GITHUB_REPOSITORY}:${MAJOR_MINOR}" \
              "ghcr.io/${GITHUB_REPOSITORY}@${IMAGE_DIGEST}"; then
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in ${RETRY_DELAY_SECONDS:-5}s..." >&2
            if [ "$attempt" -lt 3 ]; then
              sleep "${RETRY_DELAY_SECONDS:-5}"
            fi
          done
          echo "Failed to publish versioned tags to GHCR after 3 attempts" >&2
          exit 1

      - name: Verify published versioned GHCR tags
        if: ${{ inputs.mode == 'promote' }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          CANDIDATE_DIGEST: ${{ inputs.candidate_digest }}
          EXPECTED_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          MAJOR_MINOR="${RELEASE_VERSION%.*}"
          for tag in "$RELEASE_VERSION" "$MAJOR_MINOR"; do
            python3 scripts/verify_release_artifact.py \
              --image "ghcr.io/${GITHUB_REPOSITORY}:${tag}" \
              --expected-digest "$CANDIDATE_DIGEST" \
              --expected-version "$RELEASE_VERSION" \
              --expected-revision "$EXPECTED_SHA"
          done

      - name: Create release tag
        if: ${{ inputs.mode == 'promote' && steps.tag_status.outputs.tag_exists != 'true' }}
        env:
          RELEASE_TAG: v${{ inputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          for attempt in 1 2 3; do
            if git push origin "$RELEASE_TAG"; then
              exit 0
            fi
            echo "Git push attempt $attempt failed; retrying in ${RETRY_DELAY_SECONDS:-5}s..." >&2
            if [ "$attempt" -lt 3 ]; then
              sleep "${RETRY_DELAY_SECONDS:-5}"
            fi
          done
          echo "Failed to push release tag $RELEASE_TAG after 3 attempts" >&2
          exit 1

      - name: Create GitHub release
        if: ${{ inputs.mode == 'promote' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ inputs.version }}
          ALLOW_RECOVERY: ${{ inputs.allow_recovery }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$ALLOW_RECOVERY" != "true" ]; then
              echo "GitHub release already exists: $RELEASE_TAG; set allow_recovery to true to resume" >&2
              exit 1
            fi
            echo "GitHub release $RELEASE_TAG already exists"
          else
            echo "Creating GitHub release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi

      - name: Promote the verified digest to latest
        if: ${{ success() && inputs.mode == 'promote' }}
        env:
          IMAGE_DIGEST: ${{ inputs.candidate_digest }}
        run: |
          for attempt in 1 2 3; do
            if docker buildx imagetools create \
              --tag "ghcr.io/${GITHUB_REPOSITORY}:latest" \
              "ghcr.io/${GITHUB_REPOSITORY}@${IMAGE_DIGEST}"; then
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in ${RETRY_DELAY_SECONDS:-5}s..." >&2
            if [ "$attempt" -lt 3 ]; then
              sleep "${RETRY_DELAY_SECONDS:-5}"
            fi
          done
          echo "Failed to promote digest to latest after 3 attempts" >&2
          exit 1

      - name: Record promotion summary
        if: ${{ success() && inputs.mode == 'promote' }}
        env:
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ inputs.candidate_digest }}
        run: |
          MAJOR_MINOR="${VERSION%.*}"
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Release Successfully Promoted!

          - **Version:** \`${VERSION}\`
          - **Git Tag:** \`v${VERSION}\`
          - **Verified Source Digest:** \`${DIGEST}\`
          - **Promoted GHCR Tags:**
            - \`ghcr.io/${GITHUB_REPOSITORY}:${VERSION}\`
            - \`ghcr.io/${GITHUB_REPOSITORY}:${MAJOR_MINOR}\`
            - \`ghcr.io/${GITHUB_REPOSITORY}:latest\`

          All public tags now point cryptographically to the exact candidate image verified during acceptance testing.
          EOF
