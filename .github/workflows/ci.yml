name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Pre-commit & Linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    needs: [lint]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Test Suite
        run: uv run pytest -v

  requirements-drift:
    name: Cloud Run requirements drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - name: Regenerate and diff gcp-cloud-run/requirements.txt
        run: |
          uv lock
          uv export --only-group cloud-gateway --no-emit-project --no-dev --no-hashes \
            -o gcp-cloud-run/requirements.txt
          git diff --exit-code -- gcp-cloud-run/requirements.txt

  doc-links:
    name: Markdown relative links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check docs links
        run: python3 scripts/check_doc_links.py

  docker-build:
    name: Docker build (local + Cloud Run)
    needs: [lint, requirements-drift]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build local bridge image
        run: docker build -f deploy/Dockerfile .

      - name: Sync sample catalog for Cloud Run context
        run: cp catalog.json gcp-cloud-run/catalog.json

      - name: Build Cloud Run gateway image
        run: docker build -f gcp-cloud-run/Dockerfile gcp-cloud-run
